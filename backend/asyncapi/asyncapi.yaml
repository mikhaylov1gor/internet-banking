openapi: 3.0.3
info:
  title: Internet Bank Backend API
  description: |
    Спецификация API для командного проекта интернет-банка (Этап 1).
    Все запросы идут через API Gateway — один базовый URL для фронта и мобилки.
    За кулисами: Core (счета, операции), Users (аутентификация, пользователи), Credits (кредиты, тарифы).
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: API Gateway

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Сообщение об ошибке

    Account:
      type: object
      required: [id, client_id, balance, status]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        balance:
          type: number
          format: double
          example: 12345.50
        currency:
          type: string
          enum: [RUB, USD, EUR]
          default: RUB
        status:
          type: string
          enum: [active, closed]
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true

    Operation:
      type: object
      required: [id, account_id, type, amount, balance_after]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [deposit, withdraw, credit_issue, credit_repay]
        amount:
          type: number
          format: double
        balance_after:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        description:
          type: string
        credit_id:
          type: string
          format: uuid
          nullable: true

    OpenAccountRequest:
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
          format: uuid

    ChangeBalanceRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01

    User:
      type: object
      required: [id, type, email, status]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [client, employee]
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [active, blocked]
        created_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true

    LoginResponse:
      type: object
      required: [token, user_id, type]
      properties:
        token:
          type: string
          description: Access token (JWT)
        refresh_token:
          type: string
          description: Refresh token для получения новой пары токенов
        user_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [client, employee]

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Токен обновления, полученный при логине

    CreateUserRequest:
      type: object
      required: [type, email, full_name]
      properties:
        type:
          type: string
          enum: [client, employee]
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
        password:
          type: string
          writeOnly: true
          description: Если не указан, по умолчанию changeme

    CreditTariff:
      type: object
      required: [id, name, rate]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rate:
          type: number
          format: double
          example: 0.12
        min_amount:
          type: number
          format: double
        max_amount:
          type: number
          format: double

    Credit:
      type: object
      required: [id, client_id, account_id, tariff_id, amount]
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        tariff_id:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        remaining:
          type: number
          format: double
          description: Остаток долга к погашению
        rate:
          type: number
          format: double
        daily_payment:
          type: number
          format: double
        issued_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, paid, overdue]

    IssueCreditRequest:
      type: object
      required: [client_id, account_id, tariff_id, amount]
      properties:
        client_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        tariff_id:
          type: string
          format: uuid
        amount:
          type: number
          format: double

    RepayCreditRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01

    CreateTariffRequest:
      type: object
      required: [name, rate, min_amount, max_amount]
      properties:
        name:
          type: string
        rate:
          type: number
          format: double
        min_amount:
          type: number
          format: double
        max_amount:
          type: number
          format: double

  security:
    - BearerAuth: []

paths:
  /accounts:
    post:
      summary: Открыть новый счет
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: Счет создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Неверные данные или клиент заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
        '403':
          description: Нет прав (клиент может открыть только свой счет)

    get:
      summary: Список счетов (своих для клиента, всех для сотрудника)
      tags: [Accounts]
      parameters:
        - name: client_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [active, closed]
        - name: limit
          in: query
          description: Максимум записей в ответе (по умолчанию 50)
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Сколько записей пропустить от начала (пагинация; 0 — с первой)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список счетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          description: Не авторизован

  /accounts/{accountId}:
    get:
      summary: Получить счет по ID
      tags: [Accounts]
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Счет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          description: Не авторизован
        '403':
          description: Нет прав
        '404':
          description: Счет не найден

    delete:
      summary: Закрыть счет
      tags: [Accounts]
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Счет закрыт
        '400':
          description: Баланс не нулевой или неверные данные
        '401':
          description: Не авторизован
        '403':
          description: Нет прав на закрытие
        '404':
          description: Счет не найден

  /accounts/{accountId}/deposit:
    post:
      summary: Пополнить счет
      tags: [Operations]
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeBalanceRequest'
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Неверная сумма
        '401':
          description: Не авторизован
        '403':
          description: Нет прав
        '404':
          description: Счет не найден

  /accounts/{accountId}/withdraw:
    post:
      summary: Снять деньги со счета
      tags: [Operations]
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeBalanceRequest'
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          description: Недостаточно средств или неверная сумма
        '401':
          description: Не авторизован
        '403':
          description: Нет прав
        '404':
          description: Счет не найден

  /accounts/{accountId}/operations:
    get:
      summary: История операций по счету
      tags: [Operations]
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Максимум операций в ответе (по умолчанию 50)
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Сколько операций пропустить от начала (пагинация; 0 — с первой)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: История операций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operation'
        '401':
          description: Не авторизован
        '403':
          description: Нет прав
        '404':
          description: Счет не найден

  /auth/login:
    post:
      summary: Авторизация
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Токен авторизации (access + refresh)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Неверное тело запроса
        '401':
          description: Неверный логин/пароль или пользователь заблокирован

  /auth/refresh:
    post:
      summary: Обновить access token по refresh token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Неверное тело запроса
        '401':
          description: Невалидный или истёкший refresh token

  /users:
    post:
      summary: Создать пользователя (только сотрудник)
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Неверные данные или email уже существует
        '401':
          description: Не авторизован
        '403':
          description: Только для сотрудника

    get:
      summary: Список пользователей (только сотрудник)
      tags: [Users]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [client, employee]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, blocked]
        - name: limit
          in: query
          description: Максимум записей в ответе (по умолчанию 100)
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: Сколько записей пропустить от начала (пагинация; 0 — с первой)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Не авторизован
        '403':
          description: Только для сотрудника

  /users/{userId}:
    get:
      summary: Получить пользователя по ID
      tags: [Users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Не авторизован
        '403':
          description: Нет прав
        '404':
          description: Пользователь не найден

    patch:
      summary: Блокировать/разблокировать пользователя (только сотрудник, нельзя заблокировать себя)
      tags: [Users]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [block, unblock]
      responses:
        '204':
          description: Статус обновлен
        '400':
          description: Неверный action
        '401':
          description: Не авторизован
        '403':
          description: Только для сотрудника или попытка заблокировать себя
        '404':
          description: Пользователь не найден

  /tariffs:
    post:
      summary: Создать тариф кредита (только сотрудник)
      tags: [Tariffs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTariffRequest'
      responses:
        '201':
          description: Тариф создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTariff'
        '400':
          description: Неверные данные
        '401':
          description: Не авторизован
        '403':
          description: Только для сотрудника

    get:
      summary: Список тарифов
      tags: [Tariffs]
      parameters:
        - name: limit
          in: query
          description: Максимум записей в ответе (по умолчанию 50)
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Сколько записей пропустить от начала (пагинация; 0 — с первой)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список тарифов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditTariff'

  /credits:
    post:
      summary: Выдать кредит
      tags: [Credits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreditRequest'
      responses:
        '201':
          description: Кредит выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credit'
        '400':
          description: Неверные параметры, лимиты тарифа или ошибка Core (например недостаточно средств)
        '401':
          description: Не авторизован
        '403':
          description: Нет прав

    get:
      summary: Список кредитов клиента
      tags: [Credits]
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Максимум записей в ответе (по умолчанию 50)
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Сколько записей пропустить от начала (пагинация; 0 — с первой)
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Список кредитов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credit'
        '400':
          description: Неверный или отсутствующий client_id
        '401':
          description: Не авторизован
        '403':
          description: Клиент может запрашивать только свои кредиты

  /credits/{creditId}:
    get:
      summary: Получить кредит по ID
      tags: [Credits]
      parameters:
        - name: creditId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Кредит
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credit'
        '401':
          description: Не авторизован
        '403':
          description: Нет прав
        '404':
          description: Кредит не найден

  /credits/{creditId}/repay:
    post:
      summary: Погасить кредит
      tags: [Credits]
      parameters:
        - name: creditId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepayCreditRequest'
      responses:
        '200':
          description: Погашение выполнено, возвращается обновленный кредит (remaining, status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credit'
        '400':
          description: Неверная сумма, кредит не активен или ошибка Core (недостаточно средств на счете)
        '401':
          description: Не авторизован
        '403':
          description: Нет прав
        '404':
          description: Кредит не найден
