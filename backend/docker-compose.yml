services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: build/Dockerfile.core
    ports:
      - "8001:8001"
    environment:
      CORE_PORT: "8001"
      CORE_DSN: "host=postgres user=postgres password=${POSTGRES_PASSWORD:-postgres} dbname=core port=5432 sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-secret}"
      FX_BASE_URL: "${FX_BASE_URL:-https://open.er-api.com/v6/latest}"
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}"
      RABBITMQ_QUEUE: "${RABBITMQ_QUEUE:-core.operations}"
      RABBITMQ_NOTIFICATION_QUEUE: "${RABBITMQ_NOTIFICATION_QUEUE:-operations.created}"
      USERS_SERVICE_URL: "${USERS_SERVICE_URL:-http://users:8002}"
      MASTER_ACCOUNT_ID: "${MASTER_ACCOUNT_ID:-00000000-0000-0000-0000-000000000001}"
      BANK_SERVICE_USER_ID: "${BANK_SERVICE_USER_ID:-11111111-1111-1111-1111-111111111111}"
      MASTER_ACCOUNT_INITIAL_BALANCE: "${MASTER_ACCOUNT_INITIAL_BALANCE:-1000000000}"
      MASTER_ACCOUNT_CURRENCY: "${MASTER_ACCOUNT_CURRENCY:-RUB}"
      FIREBASE_CREDENTIALS_PATH: "${FIREBASE_CREDENTIALS_PATH:-/run/secrets/firebase.json}"
      MONITORING_URL: "${MONITORING_URL:-http://monitoring:8005}"
    volumes:
      - ./firebase.json:/run/secrets/firebase.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  users:
    build:
      context: .
      dockerfile: build/Dockerfile.users
    ports:
      - "8002:8002"
    environment:
      USERS_PORT: "8002"
      USERS_DSN: "host=postgres user=postgres password=${POSTGRES_PASSWORD:-postgres} dbname=users port=5432 sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-secret}"
      SSO_CLIENTS: "${SSO_CLIENTS:-client-app|any|http://localhost:3000/callback,employee-app|any|http://localhost:3001/callback}"
      SSO_FORCE_SECURE_COOKIE: "${SSO_FORCE_SECURE_COOKIE:-false}"
      MONITORING_URL: "${MONITORING_URL:-http://monitoring:8005}"
    depends_on:
      postgres:
        condition: service_healthy

  credits:
    build:
      context: .
      dockerfile: build/Dockerfile.credits
    ports:
      - "8003:8003"
    environment:
      CREDITS_PORT: "8003"
      CREDITS_DSN: "host=postgres user=postgres password=${POSTGRES_PASSWORD:-postgres} dbname=credits port=5432 sslmode=disable"
      CORE_URL: "http://core:8001"
      JWT_SECRET: "${JWT_SECRET:-secret}"
      MASTER_ACCOUNT_ID: "${MASTER_ACCOUNT_ID:-00000000-0000-0000-0000-000000000001}"
      BANK_SERVICE_USER_ID: "${BANK_SERVICE_USER_ID:-11111111-1111-1111-1111-111111111111}"
      INTERNAL_TOKEN_TTL_MIN: "${INTERNAL_TOKEN_TTL_MIN:-15}"
      MONITORING_URL: "${MONITORING_URL:-http://monitoring:8005}"
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started

  app-settings:
    build:
      context: .
      dockerfile: build/Dockerfile.appsettings
    ports:
      - "8004:8004"
    environment:
      APP_SETTINGS_PORT: "8004"
      APP_SETTINGS_DSN: "host=postgres user=postgres password=${POSTGRES_PASSWORD:-postgres} dbname=app_settings port=5432 sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-secret}"
      MONITORING_URL: "${MONITORING_URL:-http://monitoring:8005}"
    depends_on:
      postgres:
        condition: service_healthy

  monitoring:
    build:
      context: .
      dockerfile: build/Dockerfile.monitoring
    ports:
      - "8005:8005"
    environment:
      MONITORING_PORT: "8005"
      MONITORING_DSN: "host=postgres user=postgres password=${POSTGRES_PASSWORD:-postgres} dbname=monitoring port=5432 sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8005/dashboard >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core:
        condition: service_started
      users:
        condition: service_started
      credits:
        condition: service_started
      app-settings:
        condition: service_started
      monitoring:
        condition: service_healthy

volumes:
  postgres_data: {}
