services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: build/Dockerfile.core
    ports:
      - "8001:8001"
    environment:
      CORE_PORT: "8001"
      CORE_DSN: "host=postgres user=postgres password=${POSTGRES_PASSWORD:-postgres} dbname=core port=5432 sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-secret}"
    depends_on:
      postgres:
        condition: service_healthy

  users:
    build:
      context: .
      dockerfile: build/Dockerfile.users
    ports:
      - "8002:8002"
    environment:
      USERS_PORT: "8002"
      USERS_DSN: "host=postgres user=postgres password=${POSTGRES_PASSWORD:-postgres} dbname=users port=5432 sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-secret}"
    depends_on:
      postgres:
        condition: service_healthy

  credits:
    build:
      context: .
      dockerfile: build/Dockerfile.credits
    ports:
      - "8003:8003"
    environment:
      CREDITS_PORT: "8003"
      CREDITS_DSN: "host=postgres user=postgres password=${POSTGRES_PASSWORD:-postgres} dbname=credits port=5432 sslmode=disable"
      CORE_URL: "http://core:8001"
      JWT_SECRET: "${JWT_SECRET:-secret}"
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core
      - users
      - credits

volumes:
  postgres_data: {}
